<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Photo Enhancer · Login</title>
  <!-- Font Awesome (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* ----- LOGIN CARD (shown by default) ----- */
    .login-card {
      max-width: 420px;
      width: 100%;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 3rem;
      padding: 2.5rem 2rem 2.8rem;
      box-shadow: 0 25px 45px -12px rgba(0, 20, 30, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .login-card.hidden {
      display: none;
    }

    .login-card i.fa-wand-magic-sparkles {
      font-size: 3.2rem;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.2rem;
    }

    .login-card h2 {
      font-weight: 600;
      font-size: 1.9rem;
      letter-spacing: -0.02em;
      color: #0b2b3b;
      margin-bottom: 0.3rem;
    }

    .login-sub {
      color: #2c4b5e;
      opacity: 0.8;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      border-left: 3px solid #7aa3c4;
      padding-left: 1rem;
      text-align: left;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: left;
    }

    .login-form label {
      font-weight: 500;
      color: #1f4057;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .login-form input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 2.5rem;
      border: 1px solid #d6e2ef;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(2px);
      font-size: 1rem;
      transition: 0.2s;
      outline: none;
    }

    .login-form input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      background: white;
    }

    .login-btn {
      background: #1e3f5c;
      border: none;
      color: white;
      padding: 0.9rem;
      border-radius: 3rem;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border: 1px solid #2e5575;
      box-shadow: 0 8px 16px -6px rgba(23, 55, 80, 0.25);
    }

    .login-btn:hover {
      background: #12364f;
      transform: scale(0.97);
    }

    .login-error {
      color: #b91c1c;
      background: #fee2e2;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      margin-top: 0.2rem;
      display: none;
    }

    .login-error.show {
      display: block;
    }

    /* ----- MAIN APP (hidden until login) ----- */
    .app-wrapper {
      display: none;
      width: 100%;
    }

    .app-wrapper.active {
      display: block;
    }

    .card {
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 3rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 45px -12px rgba(0, 20, 30, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      transition: all 0.2s ease;
    }

    h1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      font-weight: 600;
      font-size: 2.2rem;
      letter-spacing: -0.02em;
      color: #0b2b3b;
      margin-bottom: 0.35rem;
      flex-wrap: wrap;
    }

    h1 i:first-child {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-size: 2.6rem;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.5);
      border: 1px solid #d6e2ef;
      padding: 0.4rem 1.2rem;
      border-radius: 3rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1f4057;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .logout-btn:hover {
      background: #e9f1f8;
      transform: scale(0.96);
    }

    .subhead {
      color: #2c4b5e;
      font-size: 1rem;
      font-weight: 400;
      margin-bottom: 2rem;
      border-left: 4px solid #7aa3c4;
      padding-left: 1rem;
      opacity: 0.85;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 740px) {
      .grid-2 {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .card {
        padding: 1.8rem 1.2rem;
      }
      h1 {
        font-size: 1.8rem;
      }
    }

    /* upload panel */
    .upload-panel {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 2rem;
      padding: 1.8rem 1.5rem 2rem;
      box-shadow: 0 8px 18px rgba(0, 20, 30, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .upload-area {
      background: #f0f6fe;
      border: 2px dashed #b6cfe5;
      border-radius: 1.8rem;
      padding: 2.2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      margin-bottom: 1.5rem;
    }

    .upload-area:hover {
      background: #e6f0fa;
      border-color: #6d94b9;
    }

    .upload-area i {
      font-size: 3.8rem;
      color: #3b6c94;
      opacity: 0.7;
      margin-bottom: 0.5rem;
    }

    .upload-area p {
      font-weight: 500;
      color: #1c3f55;
    }

    .upload-area small {
      display: block;
      margin-top: 0.5rem;
      color: #4d6f88;
      font-size: 0.85rem;
    }

    #fileInput {
      display: none;
    }

    .preview-container {
      position: relative;
      background: #dce8f2;
      border-radius: 1.8rem;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 25% 30%, #c0d6e8 1px, transparent 1px);
      background-size: 28px 28px;
    }

    #originalPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .placeholder-text {
      color: #2a4e69;
      font-weight: 400;
      font-size: 1rem;
      opacity: 0.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }

    .placeholder-text i {
      font-size: 2.8rem;
      opacity: 0.5;
    }

    .action-row {
      display: flex;
      gap: 0.8rem;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }

    .btn {
      background: white;
      border: none;
      padding: 0.8rem 1.6rem;
      border-radius: 3rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      box-shadow: 0 4px 10px rgba(0, 20, 30, 0.05);
      transition: 0.2s;
      cursor: pointer;
      border: 1px solid #d6e2ef;
      color: #1f4057;
      flex: 1 1 auto;
      justify-content: center;
    }

    .btn-primary {
      background: #1e3f5c;
      border: 1px solid #1a3450;
      color: white;
      box-shadow: 0 8px 16px -6px rgba(23, 55, 80, 0.25);
    }

    .btn-primary i {
      color: #a6d0ff;
    }

    .btn-primary:hover {
      background: #12364f;
      transform: scale(0.97);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.5;
      pointer-events: none;
      filter: grayscale(0.4);
    }

    /* result panel */
    .result-panel {
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 2rem;
      padding: 1.8rem 1.5rem 2rem;
      box-shadow: 0 8px 18px rgba(0, 20, 30, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.7);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .result-header h3 {
      font-weight: 600;
      color: #0e3347;
      font-size: 1.2rem;
    }

    .badge-ai {
      background: #2d5b7c;
      color: white;
      font-size: 0.7rem;
      padding: 0.2rem 1rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }

    .result-image-wrapper {
      background: #d3e0ec;
      border-radius: 1.8rem;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: radial-gradient(circle at 70% 40%, #b8cee3 1px, transparent 1px);
      background-size: 28px 28px;
      position: relative;
    }

    #enhancedPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .enhancement-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: white;
      font-size: 0.7rem;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      pointer-events: none;
    }

    .enhancement-overlay i {
      font-size: 0.6rem;
      color: #a5d8ff;
    }

    .download-row {
      margin-top: 1.5rem;
      display: flex;
      justify-content: flex-end;
    }

    .btn-download {
      background: #1f3f5a;
      color: white;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 3rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #2e5575;
    }

    .btn-download:hover {
      background: #0f3147;
      transform: scale(0.97);
    }

    .btn-download:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .spinner {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-message {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #1d4a64;
      background: #d5e6f5;
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      display: inline-block;
      opacity: 0.9;
      font-weight: 450;
    }

    .fade-in {
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    .user-tag {
      font-size: 0.8rem;
      background: rgba(255,255,255,0.4);
      padding: 0.2rem 1rem;
      border-radius: 30px;
      color: #1f4057;
      border: 1px solid #d6e2ef;
    }
  </style>
</head>
<body>

<!-- LOGIN CARD -->
<div class="login-card" id="loginCard">
  <i class="fas fa-wand-magic-sparkles"></i>
  <h2>AI Photo Enhancer</h2>
  <div class="login-sub">
    <i class="fas fa-lock" style="margin-right: 0.4rem; opacity: 0.6;"></i> 
    sign in to continue
  </div>
  <div class="login-form">
    <label><i class="fas fa-user"></i> Username</label>
    <input type="text" id="usernameInput" placeholder="Enter username" />
    <label><i class="fas fa-key"></i> Password</label>
    <input type="password" id="passwordInput" placeholder="Enter password" />
    <div class="login-error" id="loginError"><i class="fas fa-exclamation-circle"></i> Invalid username or password</div>
    <button class="login-btn" id="loginBtn"><i class="fas fa-arrow-right-to-bracket"></i> Sign in</button>
  </div>
</div>

<!-- MAIN APP (hidden until login) -->
<div class="app-wrapper" id="appWrapper">
  <div class="card">
    <h1>
      <span><i class="fas fa-wand-magic-sparkles"></i> AI Photo Enhancer</span>
      <span style="display: flex; gap: 0.6rem; align-items: center;">
        <span class="user-tag"><i class="fas fa-user-circle"></i> <span id="userDisplay">ahadai</span></span>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </span>
    </h1>
    <div class="subhead">
      <i class="fas fa-arrow-right" style="margin-right: 0.4rem; opacity: 0.6;"></i> 
      upload any photo &nbsp;·&nbsp; get enhanced preview instantly
    </div>

    <div class="grid-2">
      <!-- left: upload & original -->
      <div class="upload-panel">
        <div class="upload-area" id="uploadArea">
          <i class="fas fa-cloud-arrow-up"></i>
          <p>Tap to select image</p>
          <small>JPG, PNG, WebP · max 10MB</small>
          <input type="file" id="fileInput" accept="image/*" />
        </div>

        <div class="preview-container">
          <img id="originalPreview" src="" alt="original preview" style="display: none;" />
          <div id="placeholderOriginal" class="placeholder-text">
            <i class="fas fa-image"></i>
            <span>original photo</span>
          </div>
        </div>

        <div class="action-row">
          <button class="btn" id="clearBtn"><i class="fas fa-rotate-left"></i> Clear</button>
          <button class="btn btn-primary" id="enhanceBtn" disabled>
            <i class="fas fa-wand-sparkles"></i> Enhance
          </button>
        </div>
        <div id="uploadStatus" class="status-message" style="margin-top: 0.8rem;">
          <i class="fas fa-circle-info"></i> no image selected
        </div>
      </div>

      <!-- right: result -->
      <div class="result-panel">
        <div class="result-header">
          <h3><i class="fas fa-star" style="color: #fbbf24; margin-right: 0.4rem;"></i> Enhanced</h3>
          <span class="badge-ai"><i class="fas fa-microchip"></i> AI</span>
        </div>

        <div class="result-image-wrapper">
          <img id="enhancedPreview" src="" alt="enhanced preview" style="display: none;" />
          <div id="placeholderEnhanced" class="placeholder-text">
            <i class="fas fa-robot"></i>
            <span>waiting for image</span>
          </div>
          <div class="enhancement-overlay" id="enhanceOverlay" style="display: none;">
            <i class="fas fa-bolt"></i> AI enhanced
          </div>
        </div>

        <div class="download-row">
          <button class="btn-download" id="downloadBtn" disabled>
            <i class="fas fa-download"></i> Download
          </button>
        </div>
        <div id="enhanceStatus" class="status-message" style="margin-top: 0.8rem;">
          <i class="fas fa-hourglass-half"></i> ready
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- LOGIN ----------
    const loginCard = document.getElementById('loginCard');
    const appWrapper = document.getElementById('appWrapper');
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const userDisplay = document.getElementById('userDisplay');

    // Hardcoded credentials
    const VALID_USER = 'ahadai';
    const VALID_PASS = 'ahadai';

    function doLogin() {
      const user = usernameInput.value.trim();
      const pass = passwordInput.value.trim();
      if (user === VALID_USER && pass === VALID_PASS) {
        loginError.classList.remove('show');
        loginCard.classList.add('hidden');
        appWrapper.classList.add('active');
        userDisplay.textContent = user;
        // reset any stale state
        resetAll(false);
        return true;
      } else {
        loginError.classList.add('show');
        return false;
      }
    }

    loginBtn.addEventListener('click', doLogin);

    // Enter key on inputs
    [usernameInput, passwordInput].forEach(input => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') doLogin();
      });
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', function() {
      appWrapper.classList.remove('active');
      loginCard.classList.remove('hidden');
      loginError.classList.remove('show');
      // clear sensitive fields
      passwordInput.value = '';
      usernameInput.value = '';
    });

    // ---------- APP LOGIC (same as before, with resetAll adapted) ----------
    const fileInput = document.getElementById('fileInput');
    const uploadArea = document.getElementById('uploadArea');
    const originalPreview = document.getElementById('originalPreview');
    const placeholderOriginal = document.getElementById('placeholderOriginal');
    const enhancedPreview = document.getElementById('enhancedPreview');
    const placeholderEnhanced = document.getElementById('placeholderEnhanced');
    const enhanceOverlay = document.getElementById('enhanceOverlay');
    const enhanceBtn = document.getElementById('enhanceBtn');
    const clearBtn = document.getElementById('clearBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const uploadStatus = document.getElementById('uploadStatus');
    const enhanceStatus = document.getElementById('enhanceStatus');

    let currentFile = null;
    let originalImageData = null;
    let enhancedImageData = null;
    let isEnhancing = false;

    function resetAll(keepFile = false) {
      if (!keepFile) {
        currentFile = null;
        originalImageData = null;
        fileInput.value = '';
      }
      enhancedImageData = null;
      originalPreview.style.display = 'none';
      placeholderOriginal.style.display = 'flex';
      enhancedPreview.style.display = 'none';
      placeholderEnhanced.style.display = 'flex';
      enhanceOverlay.style.display = 'none';
      enhanceBtn.disabled = true;
      downloadBtn.disabled = true;
      if (!keepFile) {
        uploadStatus.innerHTML = `<i class="fas fa-circle-info"></i> no image selected`;
        enhanceStatus.innerHTML = `<i class="fas fa-hourglass-half"></i> ready`;
      } else {
        enhanceStatus.innerHTML = `<i class="fas fa-hourglass-half"></i> ready for enhancement`;
      }
      if (originalImageData) {
        enhanceBtn.disabled = false;
        uploadStatus.innerHTML = `<i class="fas fa-check-circle" style="color: #1f7b4d;"></i> image loaded · ready`;
      }
    }

    function displayOriginal(dataUrl) {
      originalPreview.src = dataUrl;
      originalPreview.style.display = 'block';
      placeholderOriginal.style.display = 'none';
      enhanceBtn.disabled = false;
      uploadStatus.innerHTML = `<i class="fas fa-check-circle" style="color: #1f7b4d;"></i> image loaded · ready`;
    }

    function displayEnhanced(dataUrl) {
      enhancedPreview.src = dataUrl;
      enhancedPreview.style.display = 'block';
      placeholderEnhanced.style.display = 'none';
      enhanceOverlay.style.display = 'flex';
      downloadBtn.disabled = false;
      enhanceStatus.innerHTML = `<i class="fas fa-check-circle" style="color: #1f7b4d;"></i> enhancement complete ✨`;
    }

    function simulateEnhancement(imageDataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;
          const contrast = 1.2;
          const saturation = 1.15;
          const brightness = 1.02;
          for (let i = 0; i < data.length; i += 4) {
            let r = data[i], g = data[i+1], b = data[i+2];
            r = r * brightness; g = g * brightness; b = b * brightness;
            r = (r - 128) * contrast + 128;
            g = (g - 128) * contrast + 128;
            b = (b - 128) * contrast + 128;
            const gray = 0.299 * r + 0.587 * g + 0.114 * b;
            r = gray + (r - gray) * saturation;
            g = gray + (g - gray) * saturation;
            b = gray + (b - gray) * saturation;
            data[i] = Math.min(255, Math.max(0, r));
            data[i+1] = Math.min(255, Math.max(0, g));
            data[i+2] = Math.min(255, Math.max(0, b));
          }
          ctx.putImageData(imageData, 0, 0);
          setTimeout(() => {
            resolve(canvas.toDataURL('image/png'));
          }, 500 + Math.random() * 300);
        };
        img.onerror = function() { resolve(imageDataUrl); };
        img.src = imageDataUrl;
      });
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) {
        uploadStatus.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #b45309;"></i> invalid file`;
        return;
      }
      currentFile = file;
      const reader = new FileReader();
      reader.onload = function(e) {
        const dataUrl = e.target.result;
        originalImageData = dataUrl;
        displayOriginal(dataUrl);
        enhancedImageData = null;
        enhancedPreview.style.display = 'none';
        placeholderEnhanced.style.display = 'flex';
        enhanceOverlay.style.display = 'none';
        downloadBtn.disabled = true;
        enhanceStatus.innerHTML = `<i class="fas fa-hourglass-half"></i> ready for enhancement`;
      };
      reader.readAsDataURL(file);
    }

    uploadArea.addEventListener('click', function(e) {
      if (e.target.closest('button')) return;
      fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
      if (this.files && this.files.length > 0) {
        handleFile(this.files[0]);
      }
    });

    clearBtn.addEventListener('click', function() {
      resetAll(false);
      fileInput.value = '';
      currentFile = null;
      originalImageData = null;
      enhancedImageData = null;
      originalPreview.style.display = 'none';
      placeholderOriginal.style.display = 'flex';
      enhancedPreview.style.display = 'none';
      placeholderEnhanced.style.display = 'flex';
      enhanceOverlay.style.display = 'none';
      enhanceBtn.disabled = true;
      downloadBtn.disabled = true;
      uploadStatus.innerHTML = `<i class="fas fa-circle-info"></i> no image selected`;
      enhanceStatus.innerHTML = `<i class="fas fa-hourglass-half"></i> ready`;
    });

    enhanceBtn.addEventListener('click', async function() {
      if (isEnhancing) return;
      if (!originalImageData) {
        enhanceStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> no image to enhance`;
        return;
      }
      isEnhancing = true;
      enhanceBtn.disabled = true;
      enhanceBtn.innerHTML = `<span class="spinner"></span> enhancing...`;
      enhanceStatus.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> AI is working ...`;
      try {
        const result = await simulateEnhancement(originalImageData);
        enhancedImageData = result;
        displayEnhanced(result);
        enhanceStatus.innerHTML = `<i class="fas fa-check-circle" style="color: #1f7b4d;"></i> enhanced successfully ✨`;
      } catch (err) {
        enhanceStatus.innerHTML = `<i class="fas fa-circle-exclamation" style="color: #b91c1c;"></i> enhancement failed`;
      } finally {
        isEnhancing = false;
        enhanceBtn.disabled = false;
        enhanceBtn.innerHTML = `<i class="fas fa-wand-sparkles"></i> Enhance`;
        if (originalImageData) enhanceBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', function() {
      if (!enhancedImageData) {
        enhanceStatus.innerHTML = `<i class="fas fa-exclamation-triangle"></i> no enhanced image`;
        return;
      }
      const link = document.createElement('a');
      link.download = `enhanced_${Date.now()}.png`;
      link.href = enhancedImageData;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      enhanceStatus.innerHTML = `<i class="fas fa-check-circle" style="color: #1f7b4d;"></i> download started`;
    });

    // Drag and drop
    uploadArea.addEventListener('dragover', function(e) {
      e.preventDefault();
      this.style.background = '#deecf7';
      this.style.borderColor = '#3b82f6';
    });
    uploadArea.addEventListener('dragleave', function(e) {
      e.preventDefault();
      this.style.background = '#f0f6fe';
      this.style.borderColor = '#b6cfe5';
    });
    uploadArea.addEventListener('drop', function(e) {
      e.preventDefault();
      this.style.background = '#f0f6fe';
      this.style.borderColor = '#b6cfe5';
      const files = e.dataTransfer.files;
      if (files && files.length > 0 && files[0].type.startsWith('image/')) {
        handleFile(files[0]);
        const dt = new DataTransfer();
        dt.items.add(files[0]);
        fileInput.files = dt.files;
      } else {
        uploadStatus.innerHTML = `<i class="fas fa-exclamation-triangle" style="color: #b45309;"></i> drop an image file`;
      }
    });

    // click on preview to upload
    document.querySelectorAll('.preview-container, .result-image-wrapper').forEach(el => {
      el.addEventListener('click', function(e) {
        if (!originalImageData && !e.target.closest('button')) {
          fileInput.click();
        }
      });
    });

  })();
</script>

</body>
</html>
